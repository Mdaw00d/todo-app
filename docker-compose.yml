version: '3.8'

services:
  backend:
    image: todo-backend:latest
    container_name: todo-backend-container
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./todo.db
      - BETTER_AUTH_SECRET=supersecretkeyforauthentication
      - PORT=8000
    volumes:
      - todo_backend_data:/app/data

  frontend:
    image: todo-frontend:latest
    container_name: todo-frontend-container
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - PORT=3000
    depends_on:
      - backend

volumes:
  todo_backend_data: