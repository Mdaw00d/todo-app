# Default values for todo-chatbot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Backend configuration
backend:
  # Replica count for the backend service
  replicaCount: 1
  
  # Container image for the backend
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  
  # Service configuration for the backend
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    
  # Environment variables for the backend
  env:
    DATABASE_URL: "sqlite:///./todo.db"
    BETTER_AUTH_SECRET: "supersecretkeyforauthentication"
    PORT: "8000"
  
  # Resource limits and requests for the backend
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Liveness and readiness probes for the backend
  livenessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

# Frontend configuration
frontend:
  # Replica count for the frontend service
  replicaCount: 1
  
  # Container image for the frontend
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  
  # Service configuration for the frontend
  service:
    type: LoadBalancer
    port: 3000
    targetPort: 3000
    
  # Environment variables for the frontend
  env:
    NEXT_PUBLIC_API_URL: "http://backend-service:8000"
    PORT: "3000"
  
  # Resource limits and requests for the frontend
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Liveness and readiness probes for the frontend
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

# Image pull secrets if needed
imagePullSecrets: []
# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Security contexts
podSecurityContext: {}
securityContext: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Persistence configuration
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# HTTPRoute configuration (Gateway API)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers