apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-bot.fullname" . }}-config
  labels:
    {{- include "todo-bot.labels" . | nindent 4 }}
data:
  # Backend configuration
  backend-port: {{ .Values.backend.service.port | quote }}
  database-url: {{ .Values.backend.env.DATABASE_URL | quote }}
  
  # Frontend configuration
  frontend-port: {{ .Values.frontend.service.port | quote }}
  api-url: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL | quote }}