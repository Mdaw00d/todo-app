services:
- type: web
  name: todo-frontend
  env: node
  region: oregon
  buildCommand: |
    cd frontend &&
    npm install &&
    npm run build
  startCommand: cd frontend && HOST=0.0.0.0 PORT=$PORT npm start
  envVars:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: 10000

- type: web
  name: todo-backend
  env: python
  region: oregon
  buildCommand: |
    cd backend &&
    pip install -r requirements.txt
  startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: 10001